<!DOCTYPE html>
<html>
<head>
    <title>PDF Debug Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <h1>PDF Debug Test</h1>
    <div id="status">Loading...</div>
    <canvas id="pdf-canvas"></canvas>

    <script>
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdfUrl = 'https://bdtcfypvadryfeabqnlc.supabase.co/storage/v1/object/public/invoices/20240622_NO234_ALPHA_Factory.pdf';
        const statusDiv = document.getElementById('status');
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');

        async function loadPdf() {
            try {
                statusDiv.textContent = 'Loading PDF...';
                console.log('Attempting to load PDF from:', pdfUrl);

                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                
                statusDiv.textContent = `PDF loaded successfully. Pages: ${pdf.numPages}`;
                console.log('PDF loaded successfully:', pdf);

                // Render first page
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 1.0 });
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                await page.render(renderContext).promise;
                statusDiv.textContent = `PDF rendered successfully. Pages: ${pdf.numPages}`;

            } catch (error) {
                console.error('PDF loading error:', error);
                statusDiv.textContent = `Error: ${error.message}`;
            }
        }

        loadPdf();
    </script>
</body>
</html>
