# Development Docker Compose
# Use this for local development with hot reload
version: '3.8'

services:
  # Backend API Service (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/keys:/app/keys:ro
      - ./logs:/app/logs
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      # Database Configuration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      
      # Email Configuration
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@company.com}
      
      # OCR Configuration
      - ENABLE_OCR=${ENABLE_OCR:-false}
      - USE_MOCK_OCR=${USE_MOCK_OCR:-true}
      
      # JWT Secret
      - JWT_SECRET=${JWT_SECRET:-development-secret-key}
      
      # Development settings
      - DEBUG=${DEBUG:-true}
      - RELOAD=true
      
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Web Application (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    command: npm run dev

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
