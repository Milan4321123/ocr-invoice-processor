 services:
# Backend API Service
  - type: web
    name: ocr-invoice-backend
    env: docker
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    repo: https://github.com/Milan4321123/ocr-invoice-processor.git
    branch: deployy
    rootDir: backend
    envVars:
      - key: SUPABASE_URL
        value: https://bdtcfypvadryfeabqnlc.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # This will be set manually in Render dashboard for security
      - key: SUPABASE_ANON_KEY
        sync: false # This will be set manually in Render dashboard for security
      - key: SENDGRID_API_KEY
        sync: false # This will be set manually in Render dashboard for security
      - key: FROM_EMAIL
        value: adhikarimilan4321@gmail.com
      - key: FROM_NAME
        value: Invoice Processing System
      - key: JWT_SECRET
        sync: false # This will be set manually in Render dashboard for security
      - key: ENABLE_OCR
        value: "false"
      - key: USE_MOCK_OCR
        value: "true"
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"

  # Frontend Next.js Application
  - type: web
    name: ocr-invoice-frontend
    env: node
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    repo: https://github.com/Milan4321123/ocr-invoice-processor.git
    branch: deployy
    rootDir: frontend
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://bdtcfypvadryfeabqnlc.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false # This will be set manually in Render dashboard for security
      - key: NEXT_PUBLIC_API_URL
        value: https://ocr-invoice-processor.onrender.com
      - key: NODE_VERSION
        value: "18"
      - key: PORT
        value: "3000"

# Optional: Database (if you want to use Render's PostgreSQL instead of Supabase)
# databases:
#   - name: ocr-invoice-db
#     databaseName: ocr_invoice_db
#     user: ocr_user
#     region: frankfurt
#     plan: free
