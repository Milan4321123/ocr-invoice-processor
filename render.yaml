services:
# Backend API Service
  - type: web
    name: ocr-invoice-backend
    env: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    repo: https://github.com/Milan4321123/ocr-invoice-processor.git
    branch: lala
    rootDir: backend
    plan: free
    envVars:
      - key: SUPABASE_URL
        value: https://your-project.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set manually in Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false # Set manually in Render dashboard
      - key: SENDGRID_API_KEY
        sync: false # Set manually in Render dashboard
      - key: FROM_EMAIL
        value: adhikarimilan4321@gmail.com
      - key: FROM_NAME
        value: Invoice Processing System
      - key: JWT_SECRET
        sync: false # Set manually in Render dashboard
      - key: ENABLE_OCR
        value: "false"
      - key: USE_MOCK_OCR
        value: "true"
      - key: DEBUG
        value: "false"
      - key: NODE_ENV
        value: "production"
      - key: BASE_URL
        value: https://ocr-invoice-backend.onrender.com
      - key: EMAIL_PROVIDER
        value: "sendgrid"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "adhikarimilan4321@gmail.com"
      - key: SMTP_PASSWORD
        sync: false # Set manually in Render dashboard

  # Frontend Next.js Application
  - type: web
    name: ocr-invoice-frontend
    env: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    repo: https://github.com/Milan4321123/ocr-invoice-processor.git
    branch: lala
    rootDir: frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://your-project.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false # Set manually in Render dashboard
      - key: NEXT_PUBLIC_API_URL
        value: https://ocr-invoice-backend.onrender.com
      - key: NODE_ENV
        value: "production"

# Optional: Database (if you want to use Render's PostgreSQL instead of Supabase)
