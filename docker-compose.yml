version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/keys:/app/keys:ro
      - ./logs:/app/logs
    environment:
      # Database Configuration (Supabase)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      
      # Email Configuration
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@company.com}
      - FROM_NAME=${FROM_NAME:-Invoice Management System}
      
      # Security
      - JWT_SECRET=${JWT_SECRET}
      
      # OCR Configuration
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION:-us}
      - DOCUMENT_AI_PROCESSOR_ID=${DOCUMENT_AI_PROCESSOR_ID}
      - DOCUMENT_AI_PROCESSOR_VERSION=${DOCUMENT_AI_PROCESSOR_VERSION:-rc}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/keys/gcp-service-account.json
      - ENABLE_OCR=${ENABLE_OCR:-true}
      - USE_MOCK_OCR=${USE_MOCK_OCR:-false}
      - OCR_MAX_FILE_SIZE_MB=${OCR_MAX_FILE_SIZE_MB:-10}
      - OCR_REQUEST_TIMEOUT=${OCR_REQUEST_TIMEOUT:-60}
      - OCR_MAX_RETRIES=${OCR_MAX_RETRIES:-3}
      - OCR_RETRY_DELAY=${OCR_RETRY_DELAY:-5}
      
      # Application Settings
      - DEBUG=${DEBUG:-false}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - SKONTO_DEFAULT_RECIPIENT=${SKONTO_DEFAULT_RECIPIENT}
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_URL=http://backend:8000  # Internal Docker network URL
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    profiles:
      - production

volumes:
  logs:

networks:
  default:
    name: ocr-invoice-network
