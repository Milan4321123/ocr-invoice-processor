<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prüfbericht - Invoice Audit Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #1e40af;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #64748b;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
        }

        .kpi-card.good { border-left: 4px solid #10b981; }
        .kpi-card.warning { border-left: 4px solid #f59e0b; }
        .kpi-card.danger { border-left: 4px solid #ef4444; }

        .kpi-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .kpi-title {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .kpi-value {
            font-size: 2em;
            font-weight: bold;
            color: #1e293b;
        }

        .alerts-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #1e40af;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .alert-card {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }

        .alert-danger {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }

        .alert-warning {
            background: #fffbeb;
            border: 1px solid #fed7aa;
            color: #d97706;
        }

        .alert-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #2563eb;
        }

        .alert-title {
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .alert-count {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .alert-amount {
            font-size: 1.2em;
            opacity: 0.8;
        }

        .quality-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .quality-metric {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .metric-label {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1e40af;
        }

        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .metric-description {
            font-size: 0.9em;
            color: #64748b;
            margin-bottom: 15px;
        }

        .metric-bar {
            background: #e5e7eb;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .metric-fill {
            background: linear-gradient(90deg, #3b82f6, #1e40af);
            height: 100%;
            transition: width 0.8s ease;
        }

        .projects-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .project-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat {
            text-align: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .stat-label {
            display: block;
            font-size: 0.9em;
            color: #64748b;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-value {
            display: block;
            font-size: 1.8em;
            font-weight: bold;
            color: #1e40af;
        }

        .refresh-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }

        .refresh-btn:hover {
            background: #2563eb;
        }

        .timestamp {
            color: #64748b;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Prüfbericht - Invoice Audit Dashboard</h1>
            <p>Real-time invoice processing and quality monitoring</p>
            <button class="refresh-btn" onclick="loadDashboard()">🔄 Refresh Data</button>
            <div class="timestamp" id="lastUpdate"></div>
        </div>

        <div id="loading" class="loading">
            <div>📊 Loading Prüfbericht data...</div>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="dashboard" style="display: none;">
            <!-- KPI Cards -->
            <div class="kpi-grid" id="kpiCards">
                <!-- KPI cards will be inserted here -->
            </div>

            <!-- Critical Alerts -->
            <div class="alerts-section">
                <h2 class="section-title">🚨 Critical Alerts</h2>
                <div class="alert-grid" id="alertCards">
                    <!-- Alert cards will be inserted here -->
                </div>
            </div>

            <!-- Data Quality Breakdown -->
            <div class="quality-section">
                <h2 class="section-title">📊 Data Quality Analysis</h2>
                <div class="quality-grid" id="qualityMetrics">
                    <!-- Quality metrics will be inserted here -->
                </div>
            </div>

            <!-- Project Overview -->
            <div class="projects-section">
                <h2 class="section-title">🏗️ Project Overview</h2>
                <div class="project-stats" id="projectStats">
                    <!-- Project stats will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function fetchReport(endpoint) {
            const response = await fetch(`${API_BASE}${endpoint}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return response.json();
        }

        function createKPICard(title, value, icon, status = '') {
            return `
                <div class="kpi-card ${status}">
                    <div class="kpi-icon">${icon}</div>
                    <div class="kpi-title">${title}</div>
                    <div class="kpi-value">${value}</div>
                </div>
            `;
        }

        function createAlertCard(type, title, count, amount) {
            return `
                <div class="alert-card alert-${type}">
                    <div class="alert-title">${title}</div>
                    <div class="alert-count">${count} invoices</div>
                    <div class="alert-amount">€${amount.toLocaleString()}</div>
                </div>
            `;
        }

        function createQualityMetric(label, value, description) {
            const percentage = Math.min(value || 0, 100);
            return `
                <div class="quality-metric">
                    <div class="metric-label">${label}</div>
                    <div class="metric-value">${percentage.toFixed(1)}%</div>
                    <div class="metric-description">${description}</div>
                    <div class="metric-bar">
                        <div class="metric-fill" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
        }

        function createProjectStat(label, value) {
            return `
                <div class="stat">
                    <span class="stat-label">${label}</span>
                    <span class="stat-value">${value}</span>
                </div>
            `;
        }

        function getStatusClass(value, thresholds) {
            if (value >= thresholds.good) return 'good';
            if (value >= thresholds.warning) return 'warning';
            return 'danger';
        }

        async function loadDashboard() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').style.display = 'none';
                document.getElementById('dashboard').style.display = 'none';

                // Fetch all reports in parallel
                const [dataQuality, criticalDates, projectAnalysis] = await Promise.all([
                    fetchReport('/api/reports/data-quality'),
                    fetchReport('/api/reports/critical-dates'),
                    fetchReport('/api/reports/project-analysis')
                ]);

                // Build KPI Cards
                const kpiHtml = [
                    createKPICard('Total Invoices', dataQuality.metrics.total_invoices, '📄'),
                    createKPICard(
                        'OCR Success Rate', 
                        `${dataQuality.metrics.ocr_statistics.completion_rate.toFixed(1)}%`, 
                        '🤖',
                        getStatusClass(dataQuality.metrics.ocr_statistics.completion_rate, { good: 90, warning: 75 })
                    ),
                    createKPICard(
                        'Overall Quality', 
                        `${dataQuality.metrics.quality_score.overall.toFixed(1)}%`, 
                        '⭐',
                        getStatusClass(dataQuality.metrics.quality_score.overall, { good: 80, warning: 60 })
                    ),
                    createKPICard(
                        'Total Value', 
                        `€${projectAnalysis.data.summary.total_amount.toLocaleString()}`, 
                        '💰'
                    )
                ].join('');

                document.getElementById('kpiCards').innerHTML = kpiHtml;

                // Build Alert Cards
                const alerts = [];
                if (criticalDates.data.overdue.count > 0) {
                    alerts.push(createAlertCard('danger', 'Overdue Invoices', 
                        criticalDates.data.overdue.count, criticalDates.data.overdue.total_amount));
                }
                if (criticalDates.data.due_this_week.count > 0) {
                    alerts.push(createAlertCard('warning', 'Due This Week', 
                        criticalDates.data.due_this_week.count, criticalDates.data.due_this_week.total_amount));
                }
                if (criticalDates.data.no_due_date.count > 0) {
                    alerts.push(createAlertCard('info', 'Missing Due Dates', 
                        criticalDates.data.no_due_date.count, criticalDates.data.no_due_date.total_amount));
                }

                document.getElementById('alertCards').innerHTML = alerts.join('');

                // Build Quality Metrics
                const qualityHtml = [
                    createQualityMetric(
                        'OCR Processing',
                        dataQuality.metrics.quality_score.ocr_processing,
                        `${dataQuality.metrics.ocr_statistics.completed}/${dataQuality.metrics.total_invoices} invoices processed`
                    ),
                    createQualityMetric(
                        'Data Completeness',
                        dataQuality.metrics.quality_score.data_completeness,
                        `${dataQuality.metrics.missing_data.total_missing} missing fields`
                    ),
                    createQualityMetric(
                        'OCR Confidence',
                        dataQuality.metrics.quality_score.ocr_confidence,
                        'Average confidence score'
                    )
                ].join('');

                document.getElementById('qualityMetrics').innerHTML = qualityHtml;

                // Build Project Stats
                const projectHtml = [
                    createProjectStat('Active Projects', projectAnalysis.data.summary.total_projects),
                    createProjectStat('Vendors', projectAnalysis.data.summary.total_vendors),
                    createProjectStat('Avg. per Project', 
                        `€${Math.round(projectAnalysis.data.summary.total_amount / projectAnalysis.data.summary.total_projects).toLocaleString()}`
                    )
                ].join('');

                document.getElementById('projectStats').innerHTML = projectHtml;

                // Update timestamp
                document.getElementById('lastUpdate').textContent = 
                    `Last updated: ${new Date().toLocaleString('de-DE')}`;

                // Show dashboard
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 
                    `Failed to load dashboard: ${error.message}. Make sure the backend server is running on http://localhost:8000`;
            }
        }

        // Load dashboard on page load
        window.addEventListener('load', loadDashboard);

        // Auto-refresh every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
